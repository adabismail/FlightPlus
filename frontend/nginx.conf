# ============================================================
# Nginx proxy for FlightPulse.
# Serves the compiled React SPA and reverse-proxies API/admin
# traffic to the Django "web" service inside the compose network.
# ============================================================

upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10M;

    # --- Django REST API ---
    location /api/ {
        proxy_pass http://django;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Django admin ---
    location /admin/ {
        proxy_pass http://django;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Django-collected static (admin/DRF assets) ---
    location /static/ {
        proxy_pass http://django;
    }

    # --- React SPA: fall back to index.html for client-side routes ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
